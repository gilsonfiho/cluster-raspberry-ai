version: "3.8"

# Override file para desenvolvimento local e testes
# Use: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  ollama:
    deploy:
      replicas: 1
      # Em desenvolvimento, remova a constraint de placement
      # placement:
      #   constraints:
      #     - node.hostname == rpi-master
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=0.0.0.0
      - N8N_LISTEN_ADDRESS=0.0.0.0
    deploy:
      replicas: 1
      # Em desenvolvimento, remova a constraint de placement
      # placement:
      #   constraints:
      #     - node.hostname == rpi-master
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
